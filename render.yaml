services:
  # ---------------------------------------------------------------------
  # بک‌اند Django REST API
  # ---------------------------------------------------------------------
  - type: web
    name: kaavan-shop-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT"
    healthCheckPath: /api/categories/
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "0"
      - key: DATABASE_URL
        fromDatabase:
          name: kaavan-shop-db
          property: connectionString
      # آدرس فرانت‌اند برای CORS/CSRF — اگر نام سرویس فرانت‌اند را عوض کردید،
      # این مقدار را هم به همان آدرس onrender.com به‌روزرسانی کنید.
      - key: FRONTEND_URL
        value: "https://kaavan-shop-frontend.onrender.com"
      - key: FRONTEND_RESET_PASSWORD_URL
        value: "https://kaavan-shop-frontend.onrender.com/reset-password"
      - key: PYTHON_VERSION
        value: "3.11.9"

  # ---------------------------------------------------------------------
  # فرانت‌اند Vue 2 (خروجی build به‌صورت استاتیک سرو می‌شود)
  # ---------------------------------------------------------------------
  - type: web
    name: kaavan-shop-frontend
    runtime: static
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: dist
    envVars:
      # آدرس بک‌اند — اگر نام سرویس بک‌اند را عوض کردید، این مقدار را هم
      # به همان آدرس onrender.com/api به‌روزرسانی کنید.
      - key: VUE_APP_API_BASE_URL
        value: "https://kaavan-shop-backend.onrender.com/api"
    routes:
      # لازم برای Vue Router با history mode - همه مسیرها به index.html هدایت شوند
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: kaavan-shop-db
    plan: free
    databaseName: kaavan_shop
    user: kaavan_shop
